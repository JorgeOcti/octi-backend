version: '3.2'

services:
  mongo:
    image: mongo:4.2.1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 500M
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'osacontrol'
      MONGO_INITDB_ROOT_PASSWORD: 'osacontrol'
    ports:
      - 27017:27017
    volumes:
      - mongo:/data/db

  redis:
    image: redis:5.0.3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 500M
    ports:
      - 6379:6379
    volumes:
      - redis:/data

  build:
    build:
      dockerfile: Dockerfile.development
      context: .
    image: andes:latest
    restart: unless-stopped
    command: ['tsc', '-w', '--project', 'tsconfig.json']
    volumes:
      - ./buildcache/:/srv/buildcache/
      - ./dist:/srv/dist
      - ./src:/srv/src
      - ./tsconfig.json:/srv/tsconfig.json

  backend:
    build:
      dockerfile: Dockerfile.development
      context: .
    image: andes:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 500M
    command: ['nodemon', 'dist/server.js', ' --max-old-space-size=4096']
    # command: ['nodemon', '--inspect=0.0.0.0:9229', 'dist/server.js', ' --max-old-space-size=4096']
    env_file:
      - .env
    environment:
      REDIS_SERVICE_SERVICE_HOST: redis
      REDIS_CLUSTERED: "false"
      MONGODB_URI: mongodb://osacontrol:osacontrol@mongo:27017/osaAndesProduction?authSource=admin
#      MONGODB_URI: mongodb+srv://osacontrol:B72R32mTPJeuw8ni7v4AYJ7ZzMyf6f9@osaproduction-uln1t.mongodb.net/osaAndesProduction?retryWrites=true&w=majority
      MIXPANEL: 6ec1276c5e0f03c5ca84343e96503bd0
      MAPBOX: pk.eyJ1IjoicmliYXJyYWNsIiwiYSI6ImNqems3dW85bTAwZmUzbnF0a2xubnl5ejUifQ.tfPmGSbHYdh2nMA6Fmxcxw
    ports:
      - 3030:3030
      - 9229:9229
      - 3070:3070
    volumes:
      - ./dist:/srv/dist
      - ./public:/srv/public
      - ./views:/srv/views
      - ./nodemon.json:/srv/nodemon.json
    depends_on:
      - redis
      - mongo

