version: '3.8'

services:
  mongo:
    image: mongo:6.0.3
    # command: --wiredTigerCacheSizeGB 60
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'osacontrol'
      MONGO_INITDB_ROOT_PASSWORD: 'osacontrol'
    ports:
      - 27017:27017
    volumes:
#      - '/Users/gmunoz/backups/osa/andes/production/mongo:/backups'
      - mongo:/data/db
      - mongoConf:/data/configdb
      - '~/backups/osa/andes/mongo:/backups'

  redis:
    image: redis:5.0.14
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis:/data

  billing:
    build:
      context: .
      dockerfile: Dockerfile.billing
    env_file:
      - .env
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://osacontrol:osacontrol@mongo:27017/osaAndesProduction?authSource=admin
    # volumes:
    #   - ./src/app:/scripts/src/app
    #   - ./src/billing:/scripts/src/billing
    #   - ./src/utils:/scripts/src/utils
    #   - ./src/request:/scripts/src/request

  backend:
    build:
      dockerfile: Dockerfile.development
      context: .
    # platform: linux/x86_64
    # platform: linux/amd64
    image: osa-andes:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: ts-node-dev --trace-warnings --transpile-only --debounce 1000 --files --respawn --max_old_space_size=4096 --watch src src/server.ts
    # command: ts-node-dev --files --respawn --transpile-only --max_old_space_size=4096 --watch src src/server.ts
    env_file:
      - .env
    environment:
      NODE_ENV: development
      SALFA_SOAP: http://wdp.salfa.cl:8440
      REDIS_SERVICE_SERVICE_HOST: redis
      REDIS_CLUSTERED: "false"
      SITE_URL: "http://localhost:3030/"
      SES_REGION: us-west-2
      # MONGODB_URI: mongodb://osacontrol:osacontrol@host.docker.internal:27017/osaAndesProduction?authSource=admin
      MONGODB_URI: mongodb://osacontrol:osacontrol@mongo:27017/osaAndesProduction?authSource=admin
#      MONGODB_URI: mongodb+srv://osacontrol:B72R32mTPJeuw8ni7v4AYJ7ZzMyf6f9@osaproduction-uln1t.mongodb.net/osaAndesProduction?retryWrites=true&w=majority&readPreference=secondary
      MIXPANEL: 6ec1276c5e0f03c5ca84343e96503bd0
      MAPBOX: pk.eyJ1IjoicmliYXJyYWNsIiwiYSI6ImNqems3dW85bTAwZmUzbnF0a2xubnl5ejUifQ.tfPmGSbHYdh2nMA6Fmxcxw
    ports:
      - 3030:3030
      - 9229:9229
      - 3070:3070
    volumes:
      - ./dist:/srv/dist
      - ./src:/srv/src
      - ./public:/srv/public
      - ./views:/srv/views
      - ./.puppeteerrc.cjs:/srv/.puppeteerrc.cjs
      - ./nodemon.json:/srv/nodemon.json
      - ./tsconfig.json:/srv/tsconfig.json
      - backend-modules:/srv/node_modules
    depends_on:
      - redis
      - mongo

  # frontend:
  #   build:
  #     dockerfile: DockerFile.frontend
  #     context: .
  #   image: andes-frontend:latest
  #   command: ['webpack', '--mode', 'development', '--watch']
  #   volumes:
  #     - ./src:/srv/src
  #     - ./public/js/app:/srv/public/js/app
  #     - frontend-modules:/srv/public/js/app/node_modules
  #   environment:
  #    NODE_ENV: development

volumes:
  mongo:
  mongoConf:
  backend-modules:
  frontend-modules:
