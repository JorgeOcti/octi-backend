version: '3.2'

services:
  mongo:
    image: mongo:3.4-jessie
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'osacontrol'
      MONGO_INITDB_ROOT_PASSWORD: 'osacontrol'
    ports:
      - 27017:27017
    volumes:
      - mongo:/data/db

  redis:
    image: redis:5.0.3
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis:/data

  build:
    build:
      dockerfile: Dockerfile.development
      context: .
    image: andes:latest
    restart: always
    command: ['tsc', '-w']
    volumes:
      - ./dist:/srv/dist
      - ./src:/srv/src
      - ./tsconfig.json:/srv/tsconfig.json

  backend:
    build:
      dockerfile: Dockerfile.development
      context: .
    image: andes:latest
    restart: always
    command: ['nodemon', 'dist/server.js']
    env_file:
      - .env
    environment:
      REDIS_SERVICE_SERVICE_HOST: redis
      MONGODB_URI: mongodb://osacontrol:osacontrol@mongo:27017/osaAndesProduction?authSource=admin
      MIXPANEL: 6ec1276c5e0f03c5ca84343e96503bd0
      MAPBOX: pk.eyJ1IjoicmliYXJyYWNsIiwiYSI6ImNqems3dW85bTAwZmUzbnF0a2xubnl5ejUifQ.tfPmGSbHYdh2nMA6Fmxcxw
    ports:
      - 3030:3030
    volumes:
      - ./dist:/srv/dist
      - ./public:/srv/public
      - ./views:/srv/views
      - ./nodemon.json:/srv/nodemon.json
    depends_on:
      - redis
      - mongo

