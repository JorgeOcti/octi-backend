version: '2'

services:

  redis:
    image: redis:latest
    container_name: redis
    ports:
    - 6379
    networks:
      - andesnet

  mongo:
    image: mongo:3.4-jessie
    container_name: mongo
    ports:
    - 27017
    networks:
      - andesnet

  web:
    build: .
    networks:
      - andesnet
    environment:
      - MONGODB_URI=mongodb://mongo:27017/mongo
      - REDIS_HOST=redis
    ports:
      - 3000:3000
    links:
      - mongo:mongo
      - redis:redis
    depends_on:
     - redis
     - mongo

networks:
  andesnet:
    driver: bridge
