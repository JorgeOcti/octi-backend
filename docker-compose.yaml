services:
  mongo:
    image: mongo:6.0.3
    # command: --wiredTigerCacheSizeGB 60
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'osacontrol'
      MONGO_INITDB_ROOT_PASSWORD: 'osacontrol'
    ports:
      - 27017:27017
    volumes:
#      - '/Users/gmunoz/backups/osa/andes/production/mongo:/backups'
      - mongo:/data/db
      - mongoConf:/data/configdb
      - '~/backups/osa/andes/mongo:/backups'
  redis:
    image: redis:5.0.14
    restart: unless-stopped
    ports:
      - 6379:6379
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "500mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis:/data
  backend:
    build:
      dockerfile: Dockerfile.development
      context: .
    # platform: linux/x86_64
    # platform: linux/amd64
    image: osa-andes:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: ts-node-dev --inspect=0.0.0.0:9229 --trace-warnings --transpile-only --debounce 1000 --files --respawn --max_old_space_size=4096 --watch src src/server.ts
    # command: ts-node-dev --files --respawn --transpile-only --max_old_space_size=4096 --watch src src/server.ts
    env_file:
      - .env
    environment:
      NODE_ENV: development
      SALFA_SOAP: http://wdp.salfa.cl:8440
      REDIS_SERVICE_SERVICE_HOST: redis
      REDIS_CLUSTERED: "false"
      SITE_URL: "http://localhost:3030/"
      SES_REGION: us-west-2
      MIXPANEL: 6ec1276c5e0f03c5ca84343e96503bd0
      MAPBOX: pk.eyJ1IjoicmliYXJyYWNsIiwiYSI6ImNqems3dW85bTAwZmUzbnF0a2xubnl5ejUifQ.tfPmGSbHYdh2nMA6Fmxcxw
    ports:
      - 3030:3030
      - 9229:9229
      - 3070:3070
    volumes:
      - ./dist/:/srv/public/js/app/dist/:ro
      - ./src:/srv/src
      - ./public:/srv/public
      - ./views:/srv/views
      - ./.puppeteerrc.cjs:/srv/.puppeteerrc.cjs
      - ./nodemon.json:/srv/nodemon.json
      - ./tsconfig.json:/srv/tsconfig.json
      # DocDB CA bundle — needed when MONGODB_URI points at AWS DocumentDB (TLS required).
      # Inert for local mongo (only used when MONGO_TLS_CA_FILE is set).
      - ./global-bundle.pem:/srv/global-bundle.pem:ro
      - backend-modules:/srv/node_modules
    depends_on:
      - redis
      - mongo
      - frontend
  frontend:
     build:
       dockerfile: DockerFile.frontend
       context: .
     image: andes-frontend:latest
     command: ['npm', 'run', 'start']
     volumes:
       - ./src:/srv/src
       - ./public/js/app/src/:/srv/public/js/app/src/
       - ./dist:/srv/public/js/app/dist
     environment:
      NODE_ENV: development
  sass:
    image: node:18.17.1-bullseye-slim
    working_dir: /app
    volumes:
      - ./public/css:/app
    command: "npm run start"

  #  billing:
  #    build:
  #      context: .
  #      dockerfile: Dockerfile.billing
  #    env_file:
  #      - .env
  #    environment:
  #      NODE_ENV: development
  #      MONGODB_URI: mongodb://osacontrol:osacontrol@mongo:27017/osaAndesProduction?authSource=admin
  #    volumes:
  #      - ./src/app:/scripts/src/app
  #      - ./src/billing:/scripts/src/billing
  #      - ./src/utils:/scripts/src/utils
  #      - ./src/request:/scripts/src/request
  #      - ./src/interfaces:/scripts/src/interfaces
  #      - ./src/@types:/scripts/src/@types
  #      - ./src/services:/scripts/src/services
  #      - ./src/mongoRaw.ts:/scripts/src/mongoRaw.ts
  #      - ./views/billing:/scripts/views/billing

volumes:
  mongo:
  mongoConf:
  backend-modules:
  redis:
