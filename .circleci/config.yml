version: 2.1

# ---------------------------------------------------------------------------
# Pipeline: build Docker images and push to env-specific ECR repos.
#
# Auth: CircleCI OIDC → AWS IAM role (no static keys).
#   The role is provisioned by terraform/ci/. Its ARN must be in the
#   `aws-ecs` context as AWS_ROLE_ARN.
#
# Branches:
#   develop  → build + push for dev  (tags: <sha>, dev, latest)
#   master   → build + push for prod (tags: <sha>, prod, latest)
#
# Deploy (ecs update-service) is intentionally NOT triggered from this
# pipeline yet — do it manually until the new infra is verified, then add a
# deploy job (see docs/DEPLOY.md §5.1).
# ---------------------------------------------------------------------------

orbs:
  aws-cli: circleci/aws-cli@4.1

executors:
  docker-builder:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    resource_class: medium

jobs:
  build-and-push:
    executor: docker-builder
    parameters:
      env:
        type: enum
        enum: ["dev", "prod"]
        description: Environment to tag the image for (dev or prod).
    environment:
      AWS_REGION: sa-east-1
      ENV: << parameters.env >>
    steps:
      - checkout

      # TEMPORARY: dump OIDC token claims + the role we're trying to assume.
      # Remove once the pipeline is working.
      - run:
          name: Debug — OIDC token claims and target role
          command: |
            echo "== AWS_ROLE_ARN =="
            echo "${AWS_ROLE_ARN}"
            echo ""
            echo "== CIRCLE_OIDC_TOKEN_V2 present? =="
            if [ -n "$CIRCLE_OIDC_TOKEN_V2" ]; then echo "yes (V2)"; else echo "no"; fi
            echo "== CIRCLE_OIDC_TOKEN present? =="
            if [ -n "$CIRCLE_OIDC_TOKEN" ]; then echo "yes (V1)"; else echo "no"; fi
            echo ""
            echo "== Decoded token payload (V2 if available, else V1) =="
            TOK="${CIRCLE_OIDC_TOKEN_V2:-$CIRCLE_OIDC_TOKEN}"
            if [ -z "$TOK" ]; then
              echo "NO TOKEN — context not attached OR OIDC not enabled for this org"
              exit 0
            fi
            # base64url decode the middle JWT segment
            PAYLOAD=$(echo "$TOK" | cut -d. -f2)
            # Pad with = to be a multiple of 4
            PADDING=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
            for i in $(seq 1 $PADDING); do PAYLOAD="${PAYLOAD}="; done
            echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null | (jq . 2>/dev/null || cat)

      # OIDC auth: the orb exchanges the CircleCI OIDC token for short-lived
      # STS credentials by calling AssumeRoleWithWebIdentity. No static keys.
      - aws-cli/setup:
          role_arn: ${AWS_ROLE_ARN}
          region: ${AWS_REGION}
          profile_name: default

      - run:
          name: Login to ECR
          command: |
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
            echo "export ECR_REGISTRY=${ECR_REGISTRY}" >> "$BASH_ENV"
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - run:
          name: Build & push andes-${ENV}/web
          command: |
            REPO="${ECR_REGISTRY}/andes-${ENV}/web"
            docker build -f Dockerfile.prod \
              -t "${REPO}:${CIRCLE_SHA1}" \
              -t "${REPO}:${ENV}" \
              -t "${REPO}:latest" \
              .
            docker push --all-tags "${REPO}"

      - run:
          name: Build & push andes-${ENV}/billing
          command: |
            REPO="${ECR_REGISTRY}/andes-${ENV}/billing"
            docker build -f Dockerfile.billing \
              -t "${REPO}:${CIRCLE_SHA1}" \
              -t "${REPO}:${ENV}" \
              -t "${REPO}:latest" \
              .
            docker push --all-tags "${REPO}"

workflows:
  build:
    jobs:
      - build-and-push:
          name: build-dev
          env: dev
          context: aws-ecs
          filters:
            branches:
              only: develop

      - build-and-push:
          name: build-prod
          env: prod
          context: aws-ecs
          filters:
            branches:
              only: master
