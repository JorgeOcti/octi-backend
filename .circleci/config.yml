version: 2.1

# ---------------------------------------------------------------------------
# Pipeline: build → push to ECR → roll ECS services → wait for stable.
#
# Auth: CircleCI OIDC → AWS IAM role (no static keys).
#   The role is provisioned by terraform/ci/. Its ARN must be in the
#   `aws-ecs` context as AWS_ROLE_ARN.
#
# Branches:
#   develop  → build → push → deploy dev   (auto)
#   master   → build → push → deploy prod  (auto)
# ---------------------------------------------------------------------------

orbs:
  aws-cli: circleci/aws-cli@4.1

executors:
  docker-builder:
    machine:
      image: ubuntu-2204:current
      # docker_layer_caching disabled — re-enable once the build is stable.
      # CircleCI's DLC occasionally corrupts its content store and causes
      # "failed to extract layer ... not found" errors.
      docker_layer_caching: false
    resource_class: medium

jobs:
  build-and-push:
    executor: docker-builder
    parameters:
      env:
        type: enum
        enum: ["dev", "prod"]
        description: Environment to tag the image for (dev or prod).
    environment:
      AWS_REGION: sa-east-1
      ENV: << parameters.env >>
    steps:
      - checkout

      # OIDC auth: the orb exchanges the CircleCI OIDC token for short-lived
      # STS credentials by calling AssumeRoleWithWebIdentity. No static keys.
      - aws-cli/setup:
          role_arn: ${AWS_ROLE_ARN}
          region: ${AWS_REGION}
          profile_name: default

      - run:
          name: Login to ECR
          command: |
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
            echo "export ECR_REGISTRY=${ECR_REGISTRY}" >> "$BASH_ENV"
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - run:
          name: Build & push andes-${ENV}/web
          command: |
            REPO="${ECR_REGISTRY}/andes-${ENV}/web"
            docker build --pull -f Dockerfile.prod \
              -t "${REPO}:${CIRCLE_SHA1}" \
              -t "${REPO}:${ENV}" \
              -t "${REPO}:latest" \
              .
            docker push --all-tags "${REPO}"

      - run:
          name: Build & push andes-${ENV}/billing
          command: |
            REPO="${ECR_REGISTRY}/andes-${ENV}/billing"
            docker build --pull -f Dockerfile.billing \
              -t "${REPO}:${CIRCLE_SHA1}" \
              -t "${REPO}:${ENV}" \
              -t "${REPO}:latest" \
              .
            docker push --all-tags "${REPO}"

  deploy:
    docker:
      - image: cimg/aws:2024.03
    parameters:
      env:
        type: enum
        enum: ["dev", "prod"]
        description: Environment to roll (dev or prod).
    environment:
      AWS_REGION: sa-east-1
      ENV: << parameters.env >>
    steps:
      - aws-cli/setup:
          role_arn: ${AWS_ROLE_ARN}
          region: ${AWS_REGION}
          profile_name: default

      - run:
          name: Force new deployment of web + worker
          command: |
            CLUSTER="andes-${ENV}-cluster"
            for SVC in web worker; do
              echo "Rolling andes-${ENV}-${SVC}..."
              aws ecs update-service \
                --cluster "${CLUSTER}" \
                --service "andes-${ENV}-${SVC}" \
                --force-new-deployment \
                --no-cli-pager \
                --query 'service.deployments[0].{status:status,desiredCount:desiredCount}' \
                --output table
            done

      - run:
          name: Wait for services to stabilize
          # Each task drains the old + boots the new. For our health-check
          # interval (15s) this typically settles in 2–5 min.
          no_output_timeout: 15m
          command: |
            CLUSTER="andes-${ENV}-cluster"
            echo "Waiting for services-stable on ${CLUSTER}..."
            aws ecs wait services-stable \
              --cluster "${CLUSTER}" \
              --services "andes-${ENV}-web" "andes-${ENV}-worker"
            echo "Both services stable. Final state:"
            aws ecs describe-services \
              --cluster "${CLUSTER}" \
              --services "andes-${ENV}-web" "andes-${ENV}-worker" \
              --query 'services[].{service:serviceName,running:runningCount,desired:desiredCount,deployments:length(deployments)}' \
              --output table

workflows:
  build-deploy:
    jobs:
      # ----- dev: auto-deploy on push to develop -----
      - build-and-push:
          name: build-dev
          env: dev
          context: aws-ecs
          filters:
            branches:
              only: develop

      - deploy:
          name: deploy-dev
          env: dev
          context: aws-ecs
          requires:
            - build-dev
          filters:
            branches:
              only: develop

      # ----- prod: auto-deploy on push to master -----
      - build-and-push:
          name: build-prod
          env: prod
          context: aws-ecs
          filters:
            branches:
              only: master

      - deploy:
          name: deploy-prod
          env: prod
          context: aws-ecs
          requires:
            - build-prod
          filters:
            branches:
              only: master
