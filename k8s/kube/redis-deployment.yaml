---
apiVersion: apps/v1
kind: Deployment
metadata:
  # namespace: andes-prod
  namespace: ${NAMESPACE}
  labels:
    app: redis
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
         app: redis
    spec:
      containers:
      - image: redis:latest
        name: redis
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  # namespace: andes-prod
  namespace: ${NAMESPACE}
  name: redis-service
spec:
  ports:
  - port: 6379
  selector:
    app: redis